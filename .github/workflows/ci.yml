name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django + DRF)
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-solo-pruebas"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: python manage.py test --noinput
      - name: Esquema OpenAPI sin advertencias
        run: python manage.py spectacular --file schema.yaml --fail-on-warn
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yaml
